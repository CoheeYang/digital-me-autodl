# digital-me AutoDL 服务入口：6006（AutoDL 自动映射公网域名）→ ComfyUI 8188。
# Basic 认证凭据由 install.sh 生成于 /etc/nginx/.dhhtpasswd（应用侧 DH_PROXY_USER/PASS）。
server {
    listen 6006 default_server;
    server_name _;

    # 上传声音样本/头像（multipart 经 /upload/image）
    client_max_body_size 100m;

    location / {
        auth_basic "digitalme-serve";
        auth_basic_user_file /etc/nginx/.dhhtpasswd;

        proxy_pass http://127.0.0.1:8188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # ComfyUI 进度走 WebSocket 时需要
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
